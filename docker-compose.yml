services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: denta_bot_dev
    ports:
      - "5432:5432"
    volumes:
      - denta_bot_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d denta_bot_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  denta_bot_postgres_data:
    name: agent-a8976498097c8c381_denta_bot_postgres_data
